<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kênh Giao Lưu Cộng Đồng - Google Login</title>
    
    <!-- FAVICON TRÁI ĐẤT TRẮNG ĐEN (SVG DATA URI) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%23000000' d='M256 0c141.4 0 256 114.6 256 256S397.4 512 256 512 0 397.4 0 256 114.6 0 256 0zm-11.8 32C121 32 32 121 32 244.2c2.7-.1 5.4-.2 8.2-.2 38.3 0 71.9 22.3 88 54.8 6.4 13 18.2 22.2 32.2 25 14 2.8 28.5-2.2 37.8-13l21.2-24.8c10.4-12.1 26-19 42.1-18.6 16.1.4 31.3 8 40.7 20.6l23.5 31.3c8.9 11.9 23 18.9 37.8 18.9h41.1c25.8 0 46.7 20.9 46.7 46.7 0 11.8-4.5 23.2-12.6 31.8l-12.8 13.7c29.1-38.3 46.3-86.2 46.3-138.2 0-111.4-79.9-204.2-185.1-222.2z'/></svg>">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Thư viện Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col font-sans select-none m-0 p-0">

    <!-- TOP HEADER -->
    <header class="bg-white border-b border-slate-200 h-14 flex items-center justify-between px-6 z-30 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-emerald-600 text-white rounded-xl flex items-center justify-center font-bold shadow">
                <i class="fas fa-comments"></i>
            </div>
            <span class="font-extrabold text-base text-slate-900">Kênh Giao Lưu Cộng Đồng</span>
        </div>

        <div class="flex items-center gap-3">
            <div id="userProfileGroup" class="hidden flex items-center gap-2">
                <div class="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200 hover:bg-slate-200/60 transition cursor-pointer" onclick="viewUserProfile(currentUser.email, currentUser.name, currentUser.picture)">
                    <img id="userAvatarImg" src="" class="w-7 h-7 rounded-full object-cover border" alt="Avatar">
                    <span id="userNameText" class="font-bold text-xs text-slate-800"></span>
                </div>
                <button onclick="event.stopPropagation(); openEditProfileModal()" class="text-indigo-600 hover:text-indigo-800 text-xs p-2 rounded-full hover:bg-slate-200 transition" title="Chỉnh sửa hồ sơ">
                    <i class="fas fa-pen"></i>
                </button>
                <button onclick="event.stopPropagation(); handleLogout()" class="text-red-500 hover:text-red-700 text-xs p-2 rounded-full hover:bg-slate-200 transition" title="Đăng xuất">
                    <i class="fas fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CHAT CONTAINER -->
    <main class="flex-1 p-4 max-w-4xl mx-auto w-full flex flex-col overflow-hidden">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col flex-1 overflow-hidden">
            
            <!-- Chat Room Header Info -->
            <div class="px-6 py-3 border-b border-slate-100 flex items-center justify-between bg-white">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-emerald-100 text-emerald-600 rounded-lg flex items-center justify-center font-bold text-xs">
                        <i class="fas fa-globe"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-xs text-slate-800">Phòng Trò Chuyện Trực Tuyến</h2>
                        <div class="text-[10px] text-emerald-600 font-semibold flex items-center gap-1">
                            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> Cập nhật tin nhắn thời gian thực
                        </div>
                    </div>
                </div>
            </div>

            <!-- Messages Stream Feed -->
            <div id="chatMessagesContainer" class="flex-1 p-6 overflow-y-auto space-y-4 bg-slate-50/50"></div>

            <!-- Chat Input Box Area -->
            <div class="p-4 bg-white border-t border-slate-200">
                <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3 space-y-2 focus-within:border-indigo-500 transition">
                    <textarea id="chatInputText" onkeydown="handleKeySend(event)" placeholder="Nhập tin nhắn giao lưu... (Nhấn Enter để gửi)" rows="2" class="w-full bg-transparent text-xs text-slate-800 placeholder-slate-400 outline-none resize-none"></textarea>
                    
                    <div class="flex items-center justify-between pt-2 border-t border-slate-200/60 text-xs">
                        <div class="flex items-center gap-3 text-slate-500">
                            <button onclick="triggerImageUpload()" class="hover:text-indigo-600 flex items-center gap-1 font-medium" title="Đính kèm ảnh">
                                <i class="far fa-image text-emerald-500 text-base"></i> Đính kèm ảnh
                            </button>
                            <button onclick="openGifModal()" class="hover:text-indigo-600 flex items-center gap-1 font-medium text-purple-600" title="Chọn GIF">
                                <i class="fas fa-film text-base"></i> Kho GIF
                            </button>
                        </div>

                        <div class="flex items-center gap-3">
                            <span class="text-[10px] text-slate-400">Enter ↵</span>
                            <button onclick="sendChatMessage()" class="px-4 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-bold shadow transition text-xs flex items-center gap-1.5">
                                <i class="fas fa-paper-plane"></i> Gửi
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Hidden Input Files -->
    <input type="file" id="chatImageInput" accept="image/*" class="hidden" onchange="handleChatImage(event)">
    <input type="file" id="avatarFileInput" accept="image/*" class="hidden" onchange="handleAvatarFileSelect(event)">

    <!-- GOOGLE AUTHENTICATION MODAL -->
    <div id="loginModal" class="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-8 space-y-6 border border-slate-100 text-center">
            <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-2xl shadow mb-2">
                <i class="fab fa-google"></i>
            </div>

            <div class="space-y-1">
                <h3 class="font-bold text-xl text-slate-800">Xác thực tài khoản Google</h3>
                <p class="text-xs text-slate-500">Đăng nhập bằng tài khoản Gmail thật của bạn để tham gia phòng chat</p>
            </div>

            <div class="flex justify-center py-3">
                <div id="g_id_onload"
                     data-client_id="474895252858-e9nkstvak3uj4p2r10jbr32st8m4rgqn.apps.googleusercontent.com"
                     data-callback="handleGoogleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-size="large"
                     data-theme="outline"
                     data-text="sign_in_with"
                     data-shape="pill"
                     data-logo_alignment="left">
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL TÌM KIẾM VÀ CHỌN GIF -->
    <div id="gifModal" class="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 space-y-4 border border-slate-100 relative">
            <div class="flex items-center justify-between border-b pb-3">
                <h3 class="font-bold text-base text-slate-800 flex items-center gap-2">
                    <i class="fas fa-film text-purple-600"></i> Kho ảnh GIF động
                </h3>
                <button onclick="closeGifModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-lg"></i></button>
            </div>

            <!-- Ô TÌM KIẾM GIF -->
            <div class="flex items-center gap-2 bg-slate-100 px-3 py-2 rounded-xl border border-slate-200">
                <i class="fas fa-search text-slate-400 text-xs"></i>
                <input type="text" id="gifSearchInput" onkeyup="filterGifs(this.value)" placeholder="Tìm kiếm nhanh (vd: mèo, vui, chào, ok, haha)..." class="w-full bg-transparent text-xs outline-none">
            </div>

            <!-- LƯỚI HIỂN THỊ KẾT QUẢ GIF -->
            <div id="gifGrid" class="grid grid-cols-2 gap-3 max-h-80 overflow-y-auto p-1">
                <!-- Sẽ được điền tự động bằng JavaScript -->
            </div>
        </div>
    </div>

    <!-- MODAL TRANG CÁ NHÂN TOÀN MÀN HÌNH -->
    <div id="viewProfileModal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full p-8 space-y-6 border border-slate-100 text-center relative overflow-hidden">
            <button onclick="closeViewProfileModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-600 bg-slate-100 hover:bg-slate-200 w-9 h-9 rounded-full flex items-center justify-center transition"><i class="fas fa-times text-base"></i></button>

            <!-- Background Header Banner Lớn -->
            <div class="h-32 bg-gradient-to-r from-emerald-500 to-indigo-600 -mx-8 -mt-8 rounded-t-3xl relative">
                <div class="absolute inset-0 bg-black/10"></div>
            </div>

            <!-- Avatar Lớn -->
            <div class="relative -mt-20 inline-block">
                <img id="profileCardAvatar" src="" class="w-32 h-32 rounded-full object-cover border-4 border-white shadow-xl mx-auto bg-white">
            </div>

            <!-- User Info -->
            <div class="space-y-1.5">
                <h3 id="profileCardName" class="font-extrabold text-2xl text-slate-900"></h3>
                <div id="profileBadgeSelf" class="hidden inline-block px-3 py-1 bg-emerald-100 text-emerald-700 font-bold text-xs rounded-full">Tài khoản của bạn</div>
            </div>

            <!-- Thống kê rộng rãi -->
            <div class="grid grid-cols-3 bg-slate-50 p-4 rounded-2xl border border-slate-100 text-sm gap-2 shadow-inner">
                <div>
                    <span class="text-slate-400 block text-[11px] uppercase font-bold tracking-wider">Tin nhắn</span>
                    <span id="profileCardMsgCount" class="font-extrabold text-slate-800 text-lg">0</span>
                </div>
                <div class="border-x border-slate-200">
                    <span class="text-slate-400 block text-[11px] uppercase font-bold tracking-wider">Người theo dõi</span>
                    <span id="profileCardFollowersCount" class="font-extrabold text-slate-800 text-lg">0</span>
                </div>
                <div>
                    <span class="text-slate-400 block text-[11px] uppercase font-bold tracking-wider">Đang theo dõi</span>
                    <span id="profileCardFollowingCount" class="font-extrabold text-slate-800 text-lg">0</span>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center justify-center gap-3 pt-2">
                <button id="profileFollowBtn" onclick="toggleFollowUser()" class="hidden px-6 py-2.5 rounded-xl font-bold text-sm shadow-md flex items-center gap-2 transition">
                    <i class="fas fa-user-plus"></i> <span id="followBtnText">Theo dõi</span>
                </button>
                <button id="profileEditBtn" onclick="closeViewProfileModal(); openEditProfileModal();" class="hidden px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-sm shadow-md flex items-center gap-2 transition">
                    <i class="fas fa-pen"></i> Chỉnh sửa hồ sơ
                </button>
                <button onclick="closeViewProfileModal()" class="px-6 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold text-sm transition">Đóng</button>
            </div>
        </div>
    </div>

    <!-- MODAL CHỈNH SỬA TÊN VÀ AVATAR -->
    <div id="editProfileModal" class="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 space-y-5 border border-slate-100">
            <div class="flex items-center justify-between border-b pb-3">
                <h3 class="font-bold text-base text-slate-800 flex items-center gap-2">
                    <i class="fas fa-user-pen text-indigo-600"></i> Chỉnh sửa Hồ Sơ
                </h3>
                <button onclick="closeEditProfileModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times"></i></button>
            </div>

            <div class="flex flex-col items-center gap-3">
                <div class="relative group cursor-pointer" onclick="document.getElementById('avatarFileInput').click()">
                    <img id="editAvatarPreview" src="" class="w-20 h-20 rounded-full object-cover border-2 border-indigo-500 shadow">
                    <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center text-white text-xs opacity-0 group-hover:opacity-100 transition">
                        <i class="fas fa-camera text-base"></i>
                    </div>
                </div>
                <button onclick="document.getElementById('avatarFileInput').click()" class="text-xs px-3 py-1 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 rounded-lg font-semibold transition">
                    <i class="fas fa-upload mr-1"></i> Tải ảnh từ thiết bị
                </button>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-2">Hoặc chọn ảnh đại diện có sẵn:</label>
                <div class="flex items-center justify-center gap-3 py-1">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Felix" onclick="selectPresetAvatar(this.src)" class="w-10 h-10 rounded-full cursor-pointer border-2 hover:border-indigo-500 transition hover:scale-105 bg-slate-100">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Aneka" onclick="selectPresetAvatar(this.src)" class="w-10 h-10 rounded-full cursor-pointer border-2 hover:border-indigo-500 transition hover:scale-105 bg-slate-100">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Zack" onclick="selectPresetAvatar(this.src)" class="w-10 h-10 rounded-full cursor-pointer border-2 hover:border-indigo-500 transition hover:scale-105 bg-slate-100">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Milo" onclick="selectPresetAvatar(this.src)" class="w-10 h-10 rounded-full cursor-pointer border-2 hover:border-indigo-500 transition hover:scale-105 bg-slate-100">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Luna" onclick="selectPresetAvatar(this.src)" class="w-10 h-10 rounded-full cursor-pointer border-2 hover:border-indigo-500 transition hover:scale-105 bg-slate-100">
                </div>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Tên hiển thị:</label>
                    <input type="text" id="editNameInput" class="w-full px-3 py-2 border rounded-xl text-xs outline-none focus:border-indigo-500 transition">
                </div>
            </div>

            <div class="flex items-center justify-end gap-2 pt-2 border-t">
                <button onclick="closeEditProfileModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold text-xs">Hủy</button>
                <button onclick="saveUserProfile()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-xs shadow">Lưu thay đổi</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let currentUser = null;
        let messages = [];
        let tempAvatarData = null;
        let currentViewingEmail = null;
        let lastMsgLength = 0;

        // DANH SÁCH KHO GIF ĐỘNG CHẤT LƯỢNG CAO PHỔ BIẾN
        const presetGifs = [
            { url: "https://media.giphy.com/media/3o7TKSjRrfIPjeiOkM/giphy.gif", tags: "vui cười haha funny" },
            { url: "https://media.giphy.com/media/l0HlNaQ6gWfllcjDO/giphy.gif", tags: "chào hello wave" },
            { url: "https://media.giphy.com/media/xT9IgzoKnwFNmISR8I/giphy.gif", tags: "mèo cat cute dễ thương" },
            { url: "https://media.giphy.com/media/26u4v35Q8Nm5qYCOs/giphy.gif", tags: "nhảy dance party vũ hội" },
            { url: "https://media.giphy.com/media/3oEjI6SIIHBdRxXI40/giphy.gif", tags: "ngạc nhiên wow shock" },
            { url: "https://media.giphy.com/media/111ebonMs90YLu/giphy.gif", tags: "ok đồng ý thumbs up duyệt" },
            { url: "https://media.giphy.com/media/3oKIPnAiaMCws8nOsE/giphy.gif", tags: "buồn khóc sad tears" },
            { url: "https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif", tags: "tim yêu love heart" },
            { url: "https://media.giphy.com/media/5vkW42nEAnX51Nksmi/giphy.gif", tags: "vỗ tay clap bravo tuyệt vời" },
            { url: "https://media.giphy.com/media/9uIZm4w0nC7wQ/giphy.gif", tags: "mèo cat funny bựa" }
        ];

        function initApp() {
            try {
                const savedUser = localStorage.getItem('real_google_chat_user');
                if (savedUser) {
                    currentUser = JSON.parse(savedUser);
                    document.getElementById('loginModal').classList.add('hidden');
                } else {
                    document.getElementById('loginModal').classList.remove('hidden');
                }

                loadAndCleanMessages();
            } catch(e) {}

            updateUserUI();
            renderMessages();

            setInterval(checkNewMessages, 1000);
            window.addEventListener('storage', checkNewMessages);
        }

        window.onload = initApp;

        function loadAndCleanMessages() {
            const savedMsgs = localStorage.getItem('real_google_chat_stream');
            if (savedMsgs) {
                const allMessages = JSON.parse(savedMsgs);
                const now = Date.now();
                const oneMonthMs = 30 * 24 * 60 * 60 * 1000;

                messages = allMessages.filter(msg => (now - msg.id) < oneMonthMs);
                localStorage.setItem('real_google_chat_stream', JSON.stringify(messages));
            }
        }

        function checkNewMessages() {
            const savedMsgs = localStorage.getItem('real_google_chat_stream');
            if (savedMsgs) {
                const parsedMsgs = JSON.parse(savedMsgs);
                if (parsedMsgs.length !== lastMsgLength) {
                    messages = parsedMsgs;
                    renderMessages();
                }
            }
        }

        function handleGoogleCredentialResponse(response) {
            try {
                const base64Url = response.credential.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));

                const googleUser = JSON.parse(jsonPayload);
                
                const userProfilesDB = JSON.parse(localStorage.getItem('user_profiles_db') || '{}');
                const savedProfile = userProfilesDB[googleUser.email];

                currentUser = {
                    name: (savedProfile && savedProfile.name) ? savedProfile.name : googleUser.name,
                    email: googleUser.email,
                    picture: (savedProfile && savedProfile.picture) ? savedProfile.picture : googleUser.picture
                };

                userProfilesDB[googleUser.email] = {
                    name: currentUser.name,
                    picture: currentUser.picture
                };
                localStorage.setItem('user_profiles_db', JSON.stringify(userProfilesDB));

                localStorage.setItem('real_google_chat_user', JSON.stringify(currentUser));
                document.getElementById('loginModal').classList.add('hidden');
                updateUserUI();
                renderMessages();
            } catch (error) {
                alert('Lỗi xác thực tài khoản Google!');
            }
        }

        function handleLogout() {
            localStorage.removeItem('real_google_chat_user');
            currentUser = null;
            document.getElementById('loginModal').classList.remove('hidden');
            updateUserUI();
        }

        function updateUserUI() {
            const userGrp = document.getElementById('userProfileGroup');
            const nameTxt = document.getElementById('userNameText');
            const avatarImg = document.getElementById('userAvatarImg');

            if (currentUser) {
                userGrp.classList.remove('hidden');
                nameTxt.innerText = currentUser.name;
                if(currentUser.picture) avatarImg.src = currentUser.picture;
            } else {
                userGrp.classList.add('hidden');
            }
        }

        // --- HỆ THỐNG KHO GIF HOẠT ĐỘNG ỔN ĐỊNH ---
        function openGifModal() {
            if (!currentUser) {
                alert('Vui lòng đăng nhập Google để chọn GIF!');
                return;
            }
            document.getElementById('gifModal').classList.remove('hidden');
            document.getElementById('gifSearchInput').value = '';
            renderGifGrid(presetGifs);
        }

        function closeGifModal() {
            document.getElementById('gifModal').classList.add('hidden');
        }

        function filterGifs(keyword) {
            const query = keyword.toLowerCase().trim();
            if (!query) {
                renderGifGrid(presetGifs);
                return;
            }
            const filtered = presetGifs.filter(item => item.tags.toLowerCase().includes(query));
            renderGifGrid(filtered);
        }

        function renderGifGrid(list) {
            const grid = document.getElementById('gifGrid');
            grid.innerHTML = '';
            if (list.length === 0) {
                grid.innerHTML = `<p class="col-span-2 text-center text-xs text-slate-400 py-6">Không tìm thấy GIF phù hợp</p>`;
                return;
            }
            list.forEach(item => {
                const img = document.createElement('img');
                img.src = item.url;
                img.className = "w-full h-28 object-cover rounded-xl cursor-pointer border hover:border-purple-500 transition hover:scale-[1.02]";
                img.onclick = () => sendGifMessage(item.url);
                grid.appendChild(img);
            });
        }

        function sendGifMessage(gifUrl) {
            if (!currentUser) return;

            messages.push({
                id: Date.now(),
                author: currentUser.name,
                email: currentUser.email,
                avatar: currentUser.picture || '',
                content: gifUrl,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                type: 'gif'
            });

            localStorage.setItem('real_google_chat_stream', JSON.stringify(messages));
            closeGifModal();
            renderMessages();
        }

        // --- TRANG CÁ NHÂN & THEO DÕI ---
        function viewUserProfile(email, name, picture) {
            currentViewingEmail = email;
            const userProfilesDB = JSON.parse(localStorage.getItem('user_profiles_db') || '{}');
            const targetProfile = userProfilesDB[email] || { name: name, picture: picture };

            document.getElementById('profileCardName').innerText = targetProfile.name;
            document.getElementById('profileCardAvatar').src = targetProfile.picture || `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(targetProfile.name)}`;

            const userMsgCount = messages.filter(m => m.email === email).length;
            document.getElementById('profileCardMsgCount').innerText = userMsgCount;

            const followsDB = JSON.parse(localStorage.getItem('user_follows_db') || '{}');
            
            let followersCount = 0;
            Object.keys(followsDB).forEach(followerEmail => {
                if (followsDB[followerEmail] && followsDB[followerEmail].includes(email)) {
                    followersCount++;
                }
            });
            document.getElementById('profileCardFollowersCount').innerText = followersCount;

            const followingCount = (followsDB[email] || []).length;
            document.getElementById('profileCardFollowingCount').innerText = followingCount;

            const isSelf = currentUser && currentUser.email === email;
            const followBtn = document.getElementById('profileFollowBtn');

            if (isSelf) {
                document.getElementById('profileBadgeSelf').classList.remove('hidden');
                document.getElementById('profileEditBtn').classList.remove('hidden');
                followBtn.classList.add('hidden');
            } else {
                document.getElementById('profileBadgeSelf').classList.add('hidden');
                document.getElementById('profileEditBtn').classList.add('hidden');
                followBtn.classList.remove('hidden');

                const myFollowing = followsDB[currentUser ? currentUser.email : ''] || [];
                const isFollowing = myFollowing.includes(email);
                updateFollowBtnUI(isFollowing);
            }

            document.getElementById('viewProfileModal').classList.remove('hidden');
        }

        function updateFollowBtnUI(isFollowing) {
            const btn = document.getElementById('profileFollowBtn');
            const btnText = document.getElementById('followBtnText');

            if (isFollowing) {
                btn.className = "px-6 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-bold text-sm shadow-md flex items-center gap-2 transition";
                btnText.innerText = "Đang theo dõi";
                btn.querySelector('i').className = "fas fa-check";
            } else {
                btn.className = "px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-sm shadow-md flex items-center gap-2 transition";
                btnText.innerText = "Theo dõi";
                btn.querySelector('i').className = "fas fa-user-plus";
            }
        }

        function toggleFollowUser() {
            if (!currentUser) {
                alert('Vui lòng đăng nhập để thực hiện theo dõi!');
                return;
            }
            if (!currentViewingEmail || currentViewingEmail === currentUser.email) return;

            const followsDB = JSON.parse(localStorage.getItem('user_follows_db') || '{}');
            let myFollowing = followsDB[currentUser.email] || [];

            const index = myFollowing.indexOf(currentViewingEmail);
            if (index > -1) {
                myFollowing.splice(index, 1);
            } else {
                myFollowing.push(currentViewingEmail);
            }

            followsDB[currentUser.email] = myFollowing;
            localStorage.setItem('user_follows_db', JSON.stringify(followsDB));

            viewUserProfile(currentViewingEmail, document.getElementById('profileCardName').innerText, document.getElementById('profileCardAvatar').src);
        }

        function closeViewProfileModal() {
            document.getElementById('viewProfileModal').classList.add('hidden');
        }

        function openEditProfileModal() {
            if (!currentUser) return;
            document.getElementById('editNameInput').value = currentUser.name;
            document.getElementById('editAvatarPreview').src = currentUser.picture || '';
            tempAvatarData = currentUser.picture;
            document.getElementById('editProfileModal').classList.remove('hidden');
        }

        function closeEditProfileModal() {
            document.getElementById('editProfileModal').classList.add('hidden');
        }

        function handleAvatarFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                tempAvatarData = e.target.result;
                document.getElementById('editAvatarPreview').src = tempAvatarData;
            };
            reader.readAsDataURL(file);
        }

        function selectPresetAvatar(srcUrl) {
            tempAvatarData = srcUrl;
            document.getElementById('editAvatarPreview').src = srcUrl;
        }

        function saveUserProfile() {
            const newName = document.getElementById('editNameInput').value.trim();
            if (!newName) {
                alert('Tên không được để trống!');
                return;
            }

            currentUser.name = newName;
            currentUser.picture = tempAvatarData;

            const userProfilesDB = JSON.parse(localStorage.getItem('user_profiles_db') || '{}');
            userProfilesDB[currentUser.email] = {
                name: currentUser.name,
                picture: currentUser.picture
            };
            localStorage.setItem('user_profiles_db', JSON.stringify(userProfilesDB));

            localStorage.setItem('real_google_chat_user', JSON.stringify(currentUser));
            updateUserUI();
            closeEditProfileModal();
            renderMessages();
        }

        function handleKeySend(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChatMessage();
            }
        }

        function sendChatMessage() {
            if (!currentUser) {
                alert('Vui lòng đăng nhập Google để gửi tin nhắn!');
                return;
            }

            const input = document.getElementById('chatInputText');
            const text = input.value.trim();
            if(!text) return;

            messages.push({
                id: Date.now(),
                author: currentUser.name,
                email: currentUser.email,
                avatar: currentUser.picture || '',
                content: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                type: 'text'
            });

            localStorage.setItem('real_google_chat_stream', JSON.stringify(messages));
            input.value = '';
            renderMessages();
        }

        function triggerImageUpload() {
            if (!currentUser) {
                alert('Vui lòng đăng nhập Google để gửi ảnh!');
                return;
            }
            document.getElementById('chatImageInput').click();
        }

        function handleChatImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imageUrl = e.target.result;
                messages.push({
                    id: Date.now(),
                    author: currentUser.name,
                    email: currentUser.email,
                    avatar: currentUser.picture || '',
                    content: imageUrl,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    type: 'image'
                });
                localStorage.setItem('real_google_chat_stream', JSON.stringify(messages));
                renderMessages();
                event.target.value = '';
            };
            reader.readAsDataURL(file);
        }

        function renderMessages() {
            const container = document.getElementById('chatMessagesContainer');
            container.innerHTML = '';
            lastMsgLength = messages.length;

            const userProfilesDB = JSON.parse(localStorage.getItem('user_profiles_db') || '{}');

            messages.forEach(msg => {
                const isMyMsg = currentUser && currentUser.email === msg.email;
                const div = document.createElement('div');
                
                div.className = isMyMsg 
                    ? "flex items-start gap-3 flex-row-reverse justify-start" 
                    : "flex items-start gap-3 justify-start";

                const profile = userProfilesDB[msg.email] || { name: msg.author, picture: msg.avatar };
                const displayAuthor = profile.name;
                const displayAvatar = profile.picture;

                let bodyContent = '';
                if(msg.type === 'text') {
                    bodyContent = isMyMsg 
                        ? `<div class="mt-1 bg-emerald-600 text-white border border-emerald-500 rounded-2xl rounded-tr-none px-4 py-2.5 text-xs shadow-sm inline-block text-left">${msg.content}</div>`
                        : `<div class="mt-1 bg-white border border-slate-200 rounded-2xl rounded-tl-none px-4 py-2.5 text-xs text-slate-700 shadow-sm inline-block text-left">${msg.content}</div>`;
                } else if(msg.type === 'image') {
                    bodyContent = `<div class="mt-1"><img src="${msg.content}" class="max-w-[280px] rounded-2xl border shadow-sm"></div>`;
                } else if(msg.type === 'gif') {
                    bodyContent = `<div class="mt-1"><img src="${msg.content}" class="max-w-[220px] rounded-2xl border shadow-sm"></div>`;
                }

                const avatarHtml = displayAvatar 
                    ? `<img src="${displayAvatar}" onclick="viewUserProfile('${msg.email}', '${displayAuthor.replace(/'/g, "\\'")}', '${displayAvatar}')" class="w-8 h-8 rounded-full object-cover border cursor-pointer hover:opacity-80 transition shrink-0">` 
                    : `<div onclick="viewUserProfile('${msg.email}', '${displayAuthor.replace(/'/g, "\\'")}', '')" class="w-8 h-8 bg-indigo-600 text-white rounded-full flex items-center justify-center font-bold text-xs cursor-pointer hover:opacity-80 transition shrink-0">${displayAuthor.charAt(0).toUpperCase()}</div>`;

                const alignmentClass = isMyMsg ? "text-right" : "text-left";

                div.innerHTML = `
                    ${avatarHtml}
                    <div class="${alignmentClass}">
                        <div class="flex items-center gap-2 ${isMyMsg ? 'justify-end' : 'justify-start'}">
                            <span onclick="viewUserProfile('${msg.email}', '${displayAuthor.replace(/'/g, "\\'")}', '${displayAvatar || ''}')" class="font-bold text-xs text-slate-800 hover:underline cursor-pointer">${displayAuthor}</span>
                            <span class="text-[10px] text-slate-400">${msg.time}</span>
                        </div>
                        ${bodyContent}
                    </div>
                `;
                container.appendChild(div);
            });

            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
