<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kênh Giao Lưu Cộng Đồng - Google Login</title>
    
    <!-- FAVICON TRÁI ĐẤT TRẮNG ĐEN (SVG DATA URI) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%23000000' d='M256 0c141.4 0 256 114.6 256 256S397.4 512 256 512 0 397.4 0 256 114.6 0 256 0zm-11.8 32C121 32 32 121 32 244.2c2.7-.1 5.4-.2 8.2-.2 38.3 0 71.9 22.3 88 54.8 6.4 13 18.2 22.2 32.2 25 14 2.8 28.5-2.2 37.8-13l21.2-24.8c10.4-12.1 26-19 42.1-18.6 16.1.4 31.3 8 40.7 20.6l23.5 31.3c8.9 11.9 23 18.9 37.8 18.9h41.1c25.8 0 46.7 20.9 46.7 46.7 0 11.8-4.5 23.2-12.6 31.8l-12.8 13.7c29.1-38.3 46.3-86.2 46.3-138.2 0-111.4-79.9-204.2-185.1-222.2z'/></svg>">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Thư viện Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col font-sans select-none m-0 p-0">

    <!-- TOP HEADER -->
    <header class="bg-white border-b border-slate-200 h-14 flex items-center justify-between px-6 z-30 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-emerald-600 text-white rounded-xl flex items-center justify-center font-bold shadow">
                <i class="fas fa-comments"></i>
            </div>
            <span class="font-extrabold text-base text-slate-900">Kênh Giao Lưu Cộng Đồng</span>
        </div>

        <div class="flex items-center gap-3">
            <div id="userProfileGroup" class="hidden flex items-center gap-2">
                <div class="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200 hover:bg-slate-200/60 transition cursor-pointer" onclick="viewUserProfile(currentUser.email, currentUser.name, currentUser.picture)">
                    <img id="userAvatarImg" src="" class="w-7 h-7 rounded-full object-cover border" alt="Avatar">
                    <span id="userNameText" class="font-bold text-xs text-slate-800"></span>
                </div>
                <button onclick="event.stopPropagation(); openEditProfileModal()" class="text-indigo-600 hover:text-indigo-800 text-xs p-2 rounded-full hover:bg-slate-200 transition" title="Chỉnh sửa hồ sơ">
                    <i class="fas fa-pen"></i>
                </button>
                <button onclick="event.stopPropagation(); handleLogout()" class="text-red-500 hover:text-red-700 text-xs p-2 rounded-full hover:bg-slate-200 transition" title="Đăng xuất">
                    <i class="fas fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CHAT CONTAINER -->
    <main class="flex-1 p-4 max-w-4xl mx-auto w-full flex flex-col overflow-hidden">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col flex-1 overflow-hidden">
            
            <!-- Chat Room Header Info -->
            <div class="px-6 py-3 border-b border-slate-100 flex items-center justify-between bg-white">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-emerald-100 text-emerald-600 rounded-lg flex items-center justify-center font-bold text-xs">
                        <i class="fas fa-globe"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-xs text-slate-800">Phòng Trò Chuyện Trực Tuyến</h2>
                        <div class="text-[10px] text-emerald-600 font-semibold flex items-center gap-1">
                            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> Tự động lưu tài khoản & Xóa tin nhắn sau 1 tháng
                        </div>
                    </div>
                </div>
            </div>

            <!-- Messages Stream Feed -->
            <div id="chatMessagesContainer" class="flex-1 p-6 overflow-y-auto space-y-4 bg-slate-50/50"></div>

            <!-- Chat Input Box Area -->
            <div class="p-4 bg-white border-t border-slate-200">
                <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3 space-y-2 focus-within:border-indigo-500 transition">
                    <textarea id="chatInputText" placeholder="Nhập tin nhắn giao lưu..." rows="2" class="w-full bg-transparent text-xs text-slate-800 placeholder-slate-400 outline-none resize-none"></textarea>
                    
                    <div class="flex items-center justify-between pt-2 border-t border-slate-200/60 text-xs">
                        <div class="flex items-center gap-3 text-slate-500">
                            <button onclick="triggerImageUpload()" class="hover:text-indigo-600 flex items-center gap-1 font-medium" title="Đính kèm ảnh">
                                <i class="far fa-image text-emerald-500 text-base"></i> Đính kèm ảnh
                            </button>
                        </div>

                        <div class="flex items-center gap-3">
                            <span class="text-[10px] text-slate-400">Enter ↵</span>
                            <button onclick="sendChatMessage()" class="px-4 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-bold shadow transition text-xs flex items-center gap-1.5">
                                <i class="fas fa-paper-plane"></i> Gửi
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Hidden Input Files -->
    <input type="file" id="chatImageInput" accept="image/*" class="hidden" onchange="handleChatImage(event)">
    <input type="file" id="avatarFileInput" accept="image/*" class="hidden" onchange="handleAvatarFileSelect(event)">

    <!-- GOOGLE AUTHENTICATION MODAL -->
    <div id="loginModal" class="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-8 space-y-6 border border-slate-100 text-center">
            <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-2xl shadow mb-2">
                <i class="fab fa-google"></i>
            </div>

            <div class="space-y-1">
                <h3 class="font-bold text-xl text-slate-800">Xác thực tài khoản Google</h3>
                <p class="text-xs text-slate-500">Đăng nhập bằng tài khoản Gmail thật của bạn để tham gia phòng chat</p>
            </div>

            <div class="flex justify-center py-3">
                <div id="g_id_onload"
                     data-client_id="474895252858-e9nkstvak3uj4p2r10jbr32st8m4rgqn.apps.googleusercontent.com"
                     data-callback="handleGoogleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-size="large"
                     data-theme="outline"
                     data-text="sign_in_with"
                     data-shape="pill"
                     data-logo_alignment="left">
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL TRANG CÁ NHÂN (VIEW PROFILE MODAL) -->
    <div id="viewProfileModal" class="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 space-y-6 border border-slate-100 text-center relative overflow-hidden">
            <button onclick="closeViewProfileModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fas fa-times text-lg"></i></button>

            <!-- Background Header Banner -->
            <div class="h-20 bg-gradient-to-r from-emerald-500 to-indigo-600 -mx-6 -mt-6 rounded-t-3xl"></div>

            <!-- Avatar -->
            <div class="relative -mt-16 inline-block">
                <img id="profileCardAvatar" src="" class="w-24 h-24 rounded-full object-cover border-4 border-white shadow-md mx-auto bg-white">
            </div>

            <!-- User Info -->
            <div class="space-y-1">
                <h3 id="profileCardName" class="font-bold text-lg text-slate-900"></h3>
                <div id="profileBadgeSelf" class="hidden inline-block px-2.5 py-0.5 bg-emerald-100 text-emerald-700 font-bold text-[10px] rounded-full mt-1">Tài khoản của bạn</div>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-1 bg-slate-50 p-3 rounded-2xl border border-slate-100 text-xs">
                <div>
                    <span class="text-slate-400 block text-[10px] uppercase font-bold">Số tin nhắn đã gửi</span>
                    <span id="profileCardMsgCount" class="font-extrabold text-slate-800 text-base">0</span>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center justify-center gap-2 pt-2">
                <button id="profileEditBtn" onclick="closeViewProfileModal(); openEditProfileModal();" class="hidden px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-xs shadow flex items-center gap-1.5">
                    <i class="fas fa-pen"></i> Chỉnh sửa hồ sơ
                </button>
                <button onclick="closeViewProfileModal()" class="px-5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold text-xs">Đóng</button>
            </div>
        </div>
    </div>

    <!-- MODAL CHỈNH SỬA TÊN VÀ AVATAR -->
    <div id="editProfileModal" class="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 space-y-5 border border-slate-100">
            <div class="flex items-center justify-between border-b pb-3">
                <h3 class="font-bold text-base text-slate-800 flex items-center gap-2">
                    <i class="fas fa-user-pen text-indigo-600"></i> Chỉnh sửa Hồ Sơ
                </h3>
                <button onclick="closeEditProfileModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times"></i></button>
            </div>

            <!-- Chỉnh sửa Avatar -->
            <div class="flex flex-col items-center gap-3">
                <div class="relative group cursor-pointer" onclick="document.getElementById('avatarFileInput').click()">
                    <img id="editAvatarPreview" src="" class="w-20 h-20 rounded-full object-cover border-2 border-indigo-500 shadow">
                    <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center text-white text-xs opacity-0 group-hover:opacity-100 transition">
                        <i class="fas fa-camera text-base"></i>
                    </div>
                </div>
                <button onclick="document.getElementById('avatarFileInput').click()" class="text-xs px-3 py-1 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 rounded-lg font-semibold transition">
                    <i class="fas fa-upload mr-1"></i> Tải ảnh từ thiết bị
                </button>
            </div>

            <!-- Chọn Avatar có sẵn -->
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-2">Hoặc chọn ảnh đại diện có sẵn:</label>
                <div class="flex items-center justify-center gap-3 py-1">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Felix" onclick="selectPresetAvatar(this.src)" class="w-10 h-10 rounded-full cursor-pointer border-2 hover:border-indigo-500 transition hover:scale-105 bg-slate-100">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Aneka" onclick="selectPresetAvatar(this.src)" class="w-10 h-10 rounded-full cursor-pointer border-2 hover:border-indigo-500 transition hover:scale-105 bg-slate-100">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Zack" onclick="selectPresetAvatar(this.src)" class="w-10 h-10 rounded-full cursor-pointer border-2 hover:border-indigo-500 transition hover:scale-105 bg-slate-100">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Milo" onclick="selectPresetAvatar(this.src)" class="w-10 h-10 rounded-full cursor-pointer border-2 hover:border-indigo-500 transition hover:scale-105 bg-slate-100">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Luna" onclick="selectPresetAvatar(this.src)" class="w-10 h-10 rounded-full cursor-pointer border-2 hover:border-indigo-500 transition hover:scale-105 bg-slate-100">
                </div>
            </div>

            <!-- Chỉnh sửa Tên -->
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Tên hiển thị:</label>
                    <input type="text" id="editNameInput" class="w-full px-3 py-2 border rounded-xl text-xs outline-none focus:border-indigo-500 transition">
                </div>
            </div>

            <div class="flex items-center justify-end gap-2 pt-2 border-t">
                <button onclick="closeEditProfileModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold text-xs">Hủy</button>
                <button onclick="saveUserProfile()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-xs shadow">Lưu thay đổi</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let currentUser = null;
        let messages = [];
        let tempAvatarData = null;

        function initApp() {
            try {
                const savedUser = localStorage.getItem('real_google_chat_user');
                if (savedUser) {
                    currentUser = JSON.parse(savedUser);
                    document.getElementById('loginModal').classList.add('hidden');
                } else {
                    document.getElementById('loginModal').classList.remove('hidden');
                }

                const savedMsgs = localStorage.getItem('real_google_chat_stream');
                if (savedMsgs) {
                    const allMessages = JSON.parse(savedMsgs);
                    const now = Date.now();
                    const oneMonthMs = 30 * 24 * 60 * 60 * 1000;

                    messages = allMessages.filter(msg => (now - msg.id) < oneMonthMs);
                    localStorage.setItem('real_google_chat_stream', JSON.stringify(messages));
                }
            } catch(e) {}

            updateUserUI();
            renderMessages();
        }

        window.onload = initApp;

        function handleGoogleCredentialResponse(response) {
            try {
                const base64Url = response.credential.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));

                const googleUser = JSON.parse(jsonPayload);
                
                // Đọc thông tin hồ sơ tùy chỉnh đã lưu trước đó của email này (nếu có)
                const userProfilesDB = JSON.parse(localStorage.getItem('user_profiles_db') || '{}');
                const savedProfile = userProfilesDB[googleUser.email];

                currentUser = {
                    name: (savedProfile && savedProfile.name) ? savedProfile.name : googleUser.name,
                    email: googleUser.email,
                    picture: (savedProfile && savedProfile.picture) ? savedProfile.picture : googleUser.picture
                };

                // Cập nhật lại cơ sở dữ liệu hồ sơ cá nhân
                userProfilesDB[googleUser.email] = {
                    name: currentUser.name,
                    picture: currentUser.picture
                };
                localStorage.setItem('user_profiles_db', JSON.stringify(userProfilesDB));

                localStorage.setItem('real_google_chat_user', JSON.stringify(currentUser));
                document.getElementById('loginModal').classList.add('hidden');
                updateUserUI();
                renderMessages();
            } catch (error) {
                alert('Lỗi xác thực tài khoản Google!');
            }
        }

        function handleLogout() {
            localStorage.removeItem('real_google_chat_user');
            currentUser = null;
            document.getElementById('loginModal').classList.remove('hidden');
            updateUserUI();
        }

        function updateUserUI() {
            const userGrp = document.getElementById('userProfileGroup');
            const nameTxt = document.getElementById('userNameText');
            const avatarImg = document.getElementById('userAvatarImg');

            if (currentUser) {
                userGrp.classList.remove('hidden');
                nameTxt.innerText = currentUser.name;
                if(currentUser.picture) avatarImg.src = currentUser.picture;
            } else {
                userGrp.classList.add('hidden');
            }
        }

        function viewUserProfile(email, name, picture) {
            // Lấy thông tin mới nhất từ database hồ sơ
            const userProfilesDB = JSON.parse(localStorage.getItem('user_profiles_db') || '{}');
            const targetProfile = userProfilesDB[email] || { name: name, picture: picture };

            document.getElementById('profileCardName').innerText = targetProfile.name;
            document.getElementById('profileCardAvatar').src = targetProfile.picture || `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(targetProfile.name)}`;

            const userMsgCount = messages.filter(m => m.email === email).length;
            document.getElementById('profileCardMsgCount').innerText = userMsgCount;

            const isSelf = currentUser && currentUser.email === email;
            if (isSelf) {
                document.getElementById('profileBadgeSelf').classList.remove('hidden');
                document.getElementById('profileEditBtn').classList.remove('hidden');
            } else {
                document.getElementById('profileBadgeSelf').classList.add('hidden');
                document.getElementById('profileEditBtn').classList.add('hidden');
            }

            document.getElementById('viewProfileModal').classList.remove('hidden');
        }

        function closeViewProfileModal() {
            document.getElementById('viewProfileModal').classList.add('hidden');
        }

        function openEditProfileModal() {
            if (!currentUser) return;
            document.getElementById('editNameInput').value = currentUser.name;
            document.getElementById('editAvatarPreview').src = currentUser.picture || '';
            tempAvatarData = currentUser.picture;
            document.getElementById('editProfileModal').classList.remove('hidden');
        }

        function closeEditProfileModal() {
            document.getElementById('editProfileModal').classList.add('hidden');
        }

        function handleAvatarFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                tempAvatarData = e.target.result;
                document.getElementById('editAvatarPreview').src = tempAvatarData;
            };
            reader.readAsDataURL(file);
        }

        function selectPresetAvatar(srcUrl) {
            tempAvatarData = srcUrl;
            document.getElementById('editAvatarPreview').src = srcUrl;
        }

        function saveUserProfile() {
            const newName = document.getElementById('editNameInput').value.trim();
            if (!newName) {
                alert('Tên không được để trống!');
                return;
            }

            currentUser.name = newName;
            currentUser.picture = tempAvatarData;

            // Lưu hồ sơ đã chỉnh sửa vào database local theo email
            const userProfilesDB = JSON.parse(localStorage.getItem('user_profiles_db') || '{}');
            userProfilesDB[currentUser.email] = {
                name: currentUser.name,
                picture: currentUser.picture
            };
            localStorage.setItem('user_profiles_db', JSON.stringify(userProfilesDB));

            localStorage.setItem('real_google_chat_user', JSON.stringify(currentUser));
            updateUserUI();
            closeEditProfileModal();
            renderMessages();
        }

        function sendChatMessage() {
            if (!currentUser) {
                alert('Vui lòng đăng nhập Google để gửi tin nhắn!');
                return;
            }

            const input = document.getElementById('chatInputText');
            const text = input.value.trim();
            if(!text) return;

            messages.push({
                id: Date.now(),
                author: currentUser.name,
                email: currentUser.email,
                avatar: currentUser.picture || '',
                content: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                type: 'text'
            });

            localStorage.setItem('real_google_chat_stream', JSON.stringify(messages));
            input.value = '';
            renderMessages();
        }

        function triggerImageUpload() {
            if (!currentUser) {
                alert('Vui lòng đăng nhập Google để gửi ảnh!');
                return;
            }
            document.getElementById('chatImageInput').click();
        }

        function handleChatImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imageUrl = e.target.result;
                messages.push({
                    id: Date.now(),
                    author: currentUser.name,
                    email: currentUser.email,
                    avatar: currentUser.picture || '',
                    content: imageUrl,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    type: 'image'
                });
                localStorage.setItem('real_google_chat_stream', JSON.stringify(messages));
                renderMessages();
                event.target.value = '';
            };
            reader.readAsDataURL(file);
        }

        function renderMessages() {
            const container = document.getElementById('chatMessagesContainer');
            container.innerHTML = '';

            const userProfilesDB = JSON.parse(localStorage.getItem('user_profiles_db') || '{}');

            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = "flex items-start gap-3";
                
                // Đồng bộ thông tin tên và avatar mới nhất
                const profile = userProfilesDB[msg.email] || { name: msg.author, picture: msg.avatar };
                const displayAuthor = profile.name;
                const displayAvatar = profile.picture;

                let bodyContent = `<div class="mt-1 bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-xs text-slate-700 shadow-sm inline-block">${msg.content}</div>`;
                if(msg.type === 'image') {
                    bodyContent = `<div class="mt-1"><img src="${msg.content}" class="max-w-[300px] rounded-xl border shadow-sm"></div>`;
                }

                const avatarHtml = displayAvatar 
                    ? `<img src="${displayAvatar}" onclick="viewUserProfile('${msg.email}', '${displayAuthor.replace(/'/g, "\\'")}', '${displayAvatar}')" class="w-8 h-8 rounded-full object-cover border cursor-pointer hover:opacity-80 transition">` 
                    : `<div onclick="viewUserProfile('${msg.email}', '${displayAuthor.replace(/'/g, "\\'")}', '')" class="w-8 h-8 bg-indigo-600 text-white rounded-full flex items-center justify-center font-bold text-xs cursor-pointer hover:opacity-80 transition">${displayAuthor.charAt(0).toUpperCase()}</div>`;

                div.innerHTML = `
                    ${avatarHtml}
                    <div>
                        <div class="flex items-center gap-2">
                            <span onclick="viewUserProfile('${msg.email}', '${displayAuthor.replace(/'/g, "\\'")}', '${displayAvatar || ''}')" class="font-bold text-xs text-slate-800 hover:underline cursor-pointer">${displayAuthor}</span>
                            <span class="text-[10px] text-slate-400">${msg.time}</span>
                        </div>
                        ${bodyContent}
                    </div>
                `;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
